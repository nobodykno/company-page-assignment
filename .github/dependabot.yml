version: 2

updates:
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dependabot

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dependabot