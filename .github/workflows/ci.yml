name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Start Strapi
        run: |
          pnpm --filter cms develop > strapi.log 2>&1 &

      - name: Wait for Strapi
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:1337/api >/dev/null; then
              echo "Strapi is ready"
              exit 0
            fi

            echo "Waiting for Strapi..."
            sleep 2
          done

          echo "Strapi failed to start"
          cat strapi.log
          exit 1

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRAPI_URL: ${{ vars.NEXT_PUBLIC_STRAPI_URL }}
          NEXT_PUBLIC_IMAGE_URL: ${{ vars.NEXT_PUBLIC_IMAGE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test