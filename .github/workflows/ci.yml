name: CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      # Next.js
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_STRAPI_URL: ${{ vars.NEXT_PUBLIC_STRAPI_URL }}
      NEXT_PUBLIC_IMAGE_URL: ${{ vars.NEXT_PUBLIC_IMAGE_URL }}

      # Strapi secrets
      APP_KEYS: ${{ secrets.APP_KEYS }}
      API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      # Strapi database
      DATABASE_CLIENT: ${{ vars.DATABASE_CLIENT }}
      DATABASE_FILENAME: .tmp/data.db

      # Strapi configuration
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      WINDOW_MS: ${{ vars.WINDOW_MS }}
      MAX_REQUESTS: ${{ vars.MAX_REQUESTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Clean Strapi database
        run: rm -rf cms/.tmp

      - name: Start Strapi
        run: |
          pnpm --filter cms develop > strapi.log 2>&1 &

      - name: Wait for Strapi
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:1337/admin >/dev/null; then
              echo "Strapi is ready"
              exit 0
            fi

            echo "Waiting for Strapi..."
            sleep 2
          done

          echo "Strapi failed to start"
          cat strapi.log
          exit 1

      - name: Seed Strapi
        run: pnpm --filter cms seed

      - name: Verify Strapi database
        run: |
          echo "DATABASE_CLIENT=$DATABASE_CLIENT"
          echo "DATABASE_FILENAME=$DATABASE_FILENAME"
          ls -lah cms/.tmp || true
          ls -lah cms/.tmp/data.db || true

      - name: Verify Site Setting
        run: |
          curl --fail-with-body \
            "http://localhost:1337/api/site-setting?populate=*"

      - name: Verify Services
        run: |
          curl --fail-with-body \
            "http://localhost:1337/api/services?populate=*"

      - name: Verify Team Members
        run: |
          curl --fail-with-body \
            "http://localhost:1337/api/team-members?populate=*"

      - name: Verify Blog Posts
        run: |
          curl --fail-with-body \
            "http://localhost:1337/api/blog-posts?populate=*"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test


  deploy:
    name: Deploy to Local Machine
    needs: ci
    runs-on: self-hosted

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      # Next.js build-time variables
      NEXT_PUBLIC_SITE_URL: ${{ vars.DEPLOY_NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.DEPLOY_NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_STRAPI_URL: ${{ vars.DEPLOY_NEXT_PUBLIC_STRAPI_URL }}
      NEXT_PUBLIC_IMAGE_URL: ${{ vars.DEPLOY_NEXT_PUBLIC_IMAGE_URL }}

      # Strapi secrets
      APP_KEYS: ${{ secrets.APP_KEYS }}
      API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      # Strapi database
      DATABASE_CLIENT: ${{ vars.DATABASE_CLIENT }}
      DATABASE_FILENAME: .tmp/data.db

      # Strapi configuration
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      WINDOW_MS: ${{ vars.WINDOW_MS }}
      MAX_REQUESTS: ${{ vars.MAX_REQUESTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config
      
      - name: Verify deployment environment
        run: |
          echo "DATABASE_CLIENT=$DATABASE_CLIENT"
          echo "DATABASE_FILENAME=$DATABASE_FILENAME"

      - name: Stop existing containers
        run: docker compose down

      - name: Start Strapi
        run: docker compose up -d --build cms

      - name: Wait for Strapi
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:1337/admin >/dev/null; then
              echo "Strapi is ready"
              exit 0
            fi

            echo "Waiting for Strapi..."
            sleep 2
          done

          echo "Strapi failed to start"
          docker compose logs cms
          exit 1

      - name: Seed Strapi
        run: docker compose exec -T cms pnpm seed

      - name: Verify Strapi API
        run: |
          echo "Checking team members..."
          curl --fail-with-body \
            "http://localhost:1337/api/team-members?populate=*"

          echo "Checking blog posts..."
          curl --fail-with-body \
            "http://localhost:1337/api/blog-posts?populate=*"

      - name: Build and start Web and Nginx
        run: docker compose up -d --build web nginx

      - name: Verify containers
        run: docker compose ps

      - name: Verify application
        run: |
          docker compose ps

          echo "Checking HTTPS endpoint..."
          curl -k --fail-with-body \
            https://localhost:3443/ || true