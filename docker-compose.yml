services:

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile

    container_name: company-cms
    restart: unless-stopped

    ports:
      - "1337:1337"
    
    env_file:
      - .env.production

    volumes:
      - cms-data:/app/cms/data
      - cms-public:/app/cms/public

    networks:
      - company-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL}

    container_name: company-web
    restart: unless-stopped

    expose:
      - "3000"

    depends_on:
      - cms

    networks:
      - company-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: company-nginx
    restart: unless-stopped

    ports:
      - "3000:80"
      - "3443:443"

    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - web
      - cms

    networks:
      - company-network

networks:
  company-network:
    driver: bridge

volumes:
  cms-data:
  cms-public: