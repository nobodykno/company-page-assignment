services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: company-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      STRAPI_URL: http://cms:1337
    depends_on:
      - cms
    networks:
      - company-network

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    container_name: company-cms
    restart: unless-stopped
    expose:
      - "1337"
    volumes:
      - cms-data:/app/cms/data
      - cms-public:/app/cms/public
    networks:
      - company-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: company-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web
      - cms
    networks:
      - company-network

networks:
  company-network:
    driver: bridge

volumes:
  cms-data:
  cms-public: